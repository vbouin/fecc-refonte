<style>
:root{--bg:#0B0C0E;--ink:#F1F2F3;--ink2:#A9AEB6;--ink3:#888E97;--line:#2B2F37;--brass:#CFC492;--brass2:#E1D8AE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{min-height:100dvh;display:grid;place-items:center;padding:24px;color:var(--ink);font:400 15px/1.55 Manrope,system-ui,-apple-system,sans-serif;
  background:radial-gradient(110% 80% at 50% 38%,#16181D 0%,var(--bg) 64%);-webkit-font-smoothing:antialiased}
main{width:min(420px,100%);display:grid;justify-items:center;text-align:center}
.logo{width:150px;height:auto;margin-bottom:26px}
.lg-a{fill:var(--brass)}.lg-b{fill:#fff}
.rule{width:180px;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent);margin:0 0 22px}
h1{font:600 22px/1.25 Archivo,system-ui,sans-serif;letter-spacing:-.01em;margin-bottom:8px}
p.lead{color:var(--ink2);margin-bottom:26px;max-width:34ch}
form{width:100%;display:grid;gap:12px}
label{font:500 11px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);text-align:left}
input{width:100%;padding:15px 16px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;
  font:500 16px/1 "JetBrains Mono",ui-monospace,monospace;letter-spacing:.12em;text-align:center;text-transform:uppercase}
input::placeholder{color:#6A6F78;letter-spacing:.12em}
input:focus{outline:none;border-color:var(--brass);box-shadow:0 0 0 3px rgba(207,196,146,.18)}
button{width:100%;padding:15px 18px;border-radius:999px;border:0;background:var(--brass);color:#0B0C0E;cursor:pointer;
  font:600 15px/1 Archivo,system-ui,sans-serif;transition:background .2s,transform .15s}
button:hover{background:var(--brass2)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.6;cursor:progress;transform:none}
.status{min-height:22px;font-size:13px;color:var(--ink2)}
.status.err{color:#F0A08C}
.bar{width:100%;height:2px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .25s ease}
.foot{margin-top:30px;font-size:12.5px;color:var(--ink3)}
.foot a{color:var(--ink2)}
.shake{animation:shake .38s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
</style>

  <h1>Prototype de refonte du site</h1>
  <p class="lead">Document confidentiel. Saisissez le code d'accès qui vous a été transmis.</p>
  <form id="f" autocomplete="off">
    <label for="k">Code d'accès</label>

    <button id="b" type="submit">Ouvrir le prototype</button>

<script>
(function(){
"use strict";
var FILE="site.enc?v=202609141019", MAGIC="FECCv7.1";
var f=document.getElementById("f"),k=document.getElementById("k"),b=document.getElementById("b"),
    s=document.getElementById("s"),p=document.getElementById("p");
function say(t,err){s.textContent=t;s.className="status"+(err?" err":"")}
function norm(v){return v.toUpperCase().replace(/[^A-Z0-9]/g,"")}
/* Le fichier chiffré se télécharge dès l'ouverture : quand le code est saisi, il est déjà là. */
var payload=(async function(){
  var res=await fetch(FILE,{cache:"no-store"});
  if(!res.ok) throw new Error("http "+res.status);
  var total=+res.headers.get("Content-Length")||0, got=0, parts=[];
  if(!res.body||!res.body.getReader){var whole=await res.arrayBuffer();p.style.width="100%";return whole}
  var rd=res.body.getReader();
  for(;;){var r=await rd.read();if(r.done)break;parts.push(r.value);got+=r.value.length;
    if(total)p.style.width=Math.min(100,Math.round(got/total*100))+"%";}
  p.style.width="100%";
  var out=new Uint8Array(got),o=0;parts.forEach(function(c){out.set(c,o);o+=c.length});
  return out.buffer;
})();
payload.catch(function(){});
async function openSite(pass,silent){
  if(!pass){say("Saisissez le code d'accès.",true);return}
  b.disabled=true;say("Chargement du prototype…");
  try{
    var buf=await payload;
    if(new TextDecoder().decode(buf.slice(0,8))!==MAGIC) throw new Error("format");
    var dv=new DataView(buf),iter=dv.getUint32(8),salt=buf.slice(12,28),iv=buf.slice(28,40),ct=buf.slice(40);
    say("Déchiffrement…");
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:salt,iterations:iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:iv},key,ct);
    try{sessionStorage.setItem("fecc-k",pass)}catch(_){}
    var html=await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }catch(err){
    b.disabled=false;
    if(silent){say("");try{sessionStorage.removeItem("fecc-k")}catch(_){}return}
    if(String(err&&err.message).indexOf("http")===0){say("Le prototype n'a pas pu être chargé. Vérifiez la connexion puis rechargez la page.",true);return}
    say("Code incorrect. Vérifiez-le et réessayez.",true);
    f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");k.select();
  }
}
f.addEventListener("submit",function(e){e.preventDefault();openSite(norm(k.value),false)});
var saved=null;try{saved=sessionStorage.getItem("fecc-k")}catch(_){}
if(saved){openSite(saved,true)}else{k.focus()}
})();
